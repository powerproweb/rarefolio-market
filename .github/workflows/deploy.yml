# ============================================================
#  RareFolio Marketplace — Deploy to server on push to main
# ============================================================
#
#  RELEASE CONTRACT (enforced)
#    Canonical production branch : main
#    Auto deploy trigger         : push to main
#    Manual deploy trigger       : workflow_dispatch on main only
#    Other branches              : blocked by ref guard (step 1)
#
#  Server: same BlueHost VPS as rarefolio.io (50.6.202.60)
#
#  Required GitHub repository secrets (Settings → Secrets → Actions):
#
#    Shared with rarefolio.io — copy values from that repo:
#      SFTP_HOST             — rarefolio.io
#      SFTP_USER             — BlueHost SSH / cPanel username
#      SFTP_KEY              — base64-encoded ed25519 private key
#      SFTP_PORT             — 22
#
#    Market-specific — set once:
#      MARKET_REMOTE_DIR     — absolute path to the marketplace web root
#                              e.g. /home/<user>/public_html/market.rarefolio.io
#      DEPLOY_WEBHOOK_SECRET — 64-char hex secret matching .env DEPLOY_WEBHOOK_SECRET
#                              Generate: php scripts/gen-webhook-secret.php
#
#  NOTE: BlueHost disables SSH shell access for SFTP-only accounts.
#  File sync uses the SFTP subsystem (no shell needed).
#  DB migrations are triggered via an HTTP endpoint (admin/run-migrations.php)
#  protected by DEPLOY_WEBHOOK_SECRET.
#
#  What this workflow does:
#    1. Verify deploy ref is the canonical production branch
#    2. Sync PHP application files via lftp SFTP mirror
#    3. Trigger DB migrations via HTTPS (admin/run-migrations.php)
#    4. Rebuild/restart sidecar (always, not conditional)
#    5. Verify marketplace + sidecar health via public API + localhost probes
#
#  Trigger manually:
#    GitHub → Actions → Deploy marketplace → Run workflow (main only)
# ============================================================

name: Deploy marketplace

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: sync + migrate + sidecar → server
    runs-on: ubuntu-latest

    steps:
      # ---- 0. Ref guard: only deploy from canonical production branch ------
      - name: Verify deploy ref is canonical production branch
        run: |
          CANONICAL_BRANCH="main"
          REF="${{ github.ref }}"
          echo "Deploy ref: $REF"
          if [ "$REF" != "refs/heads/$CANONICAL_BRANCH" ]; then
            echo "::error::Deploy blocked: ref '$REF' is not the canonical production branch '$CANONICAL_BRANCH'."
            echo "Only pushes to '$CANONICAL_BRANCH' or manual dispatches on '$CANONICAL_BRANCH' are allowed."
            exit 1
          fi
          echo "Ref guard passed: deploying from $CANONICAL_BRANCH"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate migration contract
        run: php scripts/validate-migration-contract.php

      - name: Resolve SFTP host
        id: sftp_host
        run: echo "host=50.6.202.60" >> "$GITHUB_OUTPUT"

      # ---- SSH key (same format as rarefolio.io deploy) --------------------
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          KEY_CONTENT="${{ secrets.SFTP_KEY }}"
          if [ -z "$KEY_CONTENT" ]; then
            echo "SFTP_KEY secret is missing"
            exit 1
          fi
          # Prefer base64 decode, then fall back to text key content.
          if printf '%s' "$KEY_CONTENT" | base64 -d > ~/.ssh/deploy_key 2>/dev/null && grep -q "PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "Loaded SFTP key from base64 secret"
          else
            printf '%b' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/deploy_key
            echo "Loaded SFTP key as raw text"
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "SFTP_KEY is not a valid private key. Store it as base64 private key content or as a full multiline key."
            exit 1
          fi
          # Non-fatal: lftp uses StrictHostKeyChecking=no for this deploy channel.
          ssh-keyscan -p 22 ${{ steps.sftp_host.outputs.host }} >> ~/.ssh/known_hosts || true

      - name: Resolve remote deploy directory
        id: deploy_target
        run: |
          REMOTE_DIR="${{ secrets.MARKET_REMOTE_DIR }}"
          if [ -z "$REMOTE_DIR" ]; then
            REMOTE_DIR="${{ secrets.SFTP_REMOTE_DIR }}"
          fi
          if [ -z "$REMOTE_DIR" ]; then
            echo "Missing remote directory secret. Set MARKET_REMOTE_DIR or SFTP_REMOTE_DIR."
            exit 1
          fi
          echo "remote_dir=$REMOTE_DIR" >> "$GITHUB_OUTPUT"

      - name: Detect sidecar source changes
        id: sidecar_changes
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD~1)"
            else
              BASE_SHA="$(git rev-parse HEAD)"
            fi
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -qE '^sidecar/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sidecar source changes detected"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no sidecar source changes detected"
          fi

      - name: Probe SFTP authentication
        run: |
          if ! timeout 30s sftp \
            -oBatchMode=yes \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=20 \
            -i ~/.ssh/deploy_key \
            -P 22 \
            "${{ secrets.SFTP_USER }}@${{ steps.sftp_host.outputs.host }}" \
            <<< $'bye' > /tmp/sftp_probe.log 2>&1; then
            cat /tmp/sftp_probe.log
            echo "SFTP probe failed. Verify SFTP_USER, SFTP_KEY, and BlueHost SSH/SFTP access."
            exit 1
          fi

      # ---- 1. Sync PHP application files via lftp SFTP --------------------
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Sync files via lftp SFTP
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            set cmd:fail-exit yes
            set sftp:connect-program 'ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=3 -p 22 -q'
            set net:timeout 60
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set net:reconnect-interval-max 20
            open -u \"${{ secrets.SFTP_USER }},\" sftp://${{ steps.sftp_host.outputs.host }}
            mirror --reverse --verbose --only-newer \
              --exclude-glob .git/ \
              --exclude-glob .gitignore \
              --exclude-glob .gitattributes \
              --exclude-glob README.md \
              --exclude-glob docs/ \
              --exclude-glob scripts/ \
              --exclude-glob dist/ \
              --exclude-glob tests/ \
              --exclude-glob verify.php \
              --exclude-glob .env \
              --exclude-glob .env.old \
              --exclude-glob .env.production \
              --exclude-glob sidecar/.env \
              --exclude-glob sidecar/.env.old \
              --exclude-glob sidecar/.env.production \
              --exclude-glob 'sidecar/node_modules/' \
              --exclude-glob 'sidecar/dist/' \
              --exclude-glob '*.log' \
              ./ ${{ steps.deploy_target.outputs.remote_dir }}/
            bye
          "

      # ---- 2. DB migrations via HTTP (no shell required) --------------------
      # Calls admin/run-migrations.php over HTTPS, authenticated by
      # DEPLOY_WEBHOOK_SECRET. Sequence is strict: plan -> dry-run -> apply.
      - name: Run migration plan, dry-run, and apply
        run: |
          if [ -z "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" ]; then
            echo "DEPLOY_WEBHOOK_SECRET not configured; refusing production deploy"
            exit 1
          fi

          : > /tmp/migration_summary.txt

          run_migration_mode() {
            mode="$1"
            output_file="/tmp/migration_${mode}.json"
            started_at="$(date +%s)"
            http_code=$(curl -sS \
              -o "$output_file" \
              -w "%{http_code}" \
              -X POST \
              -H "X-Deploy-Secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
              --data-urlencode "mode=$mode" \
              "https://market.rarefolio.io/admin/run-migrations.php")
            finished_at="$(date +%s)"
            elapsed="$((finished_at - started_at))"

            echo "mode=$mode http=$http_code elapsed_seconds=$elapsed" | tee -a /tmp/migration_summary.txt
            cat "$output_file"

            python -c "import json,sys; mode=sys.argv[1]; path=sys.argv[2]; payload=json.load(open(path, 'r', encoding='utf-8')); output=payload.get('output', ''); pending=[]; applied=0; [pending.append(parts[1]) for line in output.splitlines() if line.startswith('plan  ') and len((parts:=line.split()))>=2]; applied=sum(1 for line in output.splitlines() if line.startswith('ok    ')); print(f'{mode}_pending_files={\",\".join(pending) if pending else \"-\"}'); print(f'{mode}_applied_count={applied}')" "$mode" "$output_file" >> /tmp/migration_summary.txt

            if [ "$http_code" != "200" ]; then
              echo "Migration mode '$mode' failed"
              exit 1
            fi
          }

          run_migration_mode "plan"
          run_migration_mode "dry-run"
          run_migration_mode "apply"

      - name: Upload migration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/migration_plan.json
            /tmp/migration_dry-run.json
            /tmp/migration_apply.json
            /tmp/migration_summary.txt
      # ---- 3. Sidecar rebuild/restart + companion route gate -----------------
      # Always rebuild and restart sidecar on production deploys to prevent
      # stale runtime drift. sidecar/dist/ is excluded from file sync, so the
      # only way to update the running sidecar is via remote build + restart.
      - name: Rebuild/restart sidecar and verify companion route
        run: |
          REMOTE_DIR="${{ steps.deploy_target.outputs.remote_dir }}"
          SSH_TARGET="${{ secrets.SFTP_USER }}@${{ steps.sftp_host.outputs.host }}"
          timeout 300s ssh \
            -oBatchMode=yes \
            -oStrictHostKeyChecking=no \
            -oConnectTimeout=20 \
            -i ~/.ssh/deploy_key \
            -p 22 \
            "$SSH_TARGET" "REMOTE_DIR='$REMOTE_DIR' bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$REMOTE_DIR/sidecar"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

          restart_ok=0
          restart_method='none'
          if command -v sudo >/dev/null 2>&1 && sudo -n systemctl restart rarefolio-sidecar >/dev/null 2>&1; then
            restart_ok=1
            restart_method='sudo systemctl'
          elif command -v systemctl >/dev/null 2>&1 && systemctl restart rarefolio-sidecar >/dev/null 2>&1; then
            restart_ok=1
            restart_method='systemctl'
          elif command -v systemctl >/dev/null 2>&1 && systemctl --user restart rarefolio-sidecar >/dev/null 2>&1; then
            restart_ok=1
            restart_method='systemctl --user'
          elif command -v pm2 >/dev/null 2>&1 && pm2 restart rarefolio-sidecar >/dev/null 2>&1; then
            restart_ok=1
            restart_method='pm2'
          fi

          if [ "$restart_ok" != "1" ]; then
            node_bin=$(command -v node || true)
            if [ -n "$node_bin" ] && [ -f dist/index.js ]; then
              if command -v pkill >/dev/null 2>&1; then
                pkill -f '/sidecar/dist/index.js' >/dev/null 2>&1 || true
                pkill -f 'rarefolio-sidecar' >/dev/null 2>&1 || true
              fi
              if command -v fuser >/dev/null 2>&1; then
                fuser -k 4000/tcp >/dev/null 2>&1 || true
              fi
              nohup "$node_bin" dist/index.js >/tmp/rf-sidecar-nohup.log 2>&1 &
              sidecar_pid=$!
              sleep 2
              if kill -0 "$sidecar_pid" >/dev/null 2>&1; then
                restart_ok=1
                restart_method='nohup node dist/index.js'
              elif grep -qi 'EADDRINUSE' /tmp/rf-sidecar-nohup.log 2>/dev/null; then
                if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1; then
                  restart_ok=1
                  restart_method='existing listener on :4000 (healthy)'
                else
                  tail -n 50 /tmp/rf-sidecar-nohup.log || true
                fi
              else
                tail -n 50 /tmp/rf-sidecar-nohup.log || true
              fi
            fi
          fi

          if [ "$restart_ok" != "1" ]; then
            echo 'unable to restart sidecar process manager (systemctl or pm2) and nohup fallback failed'
            exit 1
          fi
          echo "sidecar restart method: $restart_method"

          curl -fsS http://127.0.0.1:4000/health >/tmp/rf-sidecar-health.json
          PROBE_CODE=$(curl -sS -o /tmp/rf-companion-route.json -w '%{http_code}' \
            http://127.0.0.1:4000/companion/treasury/INVALID-ENV-KEY/balance || true)
          if [ "$PROBE_CODE" != "400" ]; then
            echo "companion route probe expected HTTP 400, got $PROBE_CODE"
            cat /tmp/rf-companion-route.json || true
            exit 1
          fi
          echo 'sidecar health:'
          cat /tmp/rf-sidecar-health.json
          echo 'companion route probe:'
          cat /tmp/rf-companion-route.json
          REMOTE_SCRIPT

      # ---- 4. Health check via public API -----------------------------------
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" \
              "https://market.rarefolio.io/api/v1/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying..."
            sleep 3
          done
          echo "Health check failed after 10 attempts"
          exit 1
